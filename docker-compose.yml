services:
  postgres:
    image: postgres:16-alpine
    container_name: signpro-postgres
    environment:
      POSTGRES_DB: signpro
      POSTGRES_USER: signpro
      POSTGRES_PASSWORD: signpro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signpro -d signpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signpro-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://signpro:signpro_password@postgres:5432/signpro
      FRONTEND_URL: http://localhost:3000
      API_BASE_URL: http://localhost:4000
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_must_be_long_enough_64chars}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev_refresh_secret_change_in_production_must_be_long_enough}
      SIGNATURE_HMAC_SECRET: ${SIGNATURE_HMAC_SECRET:-dev_signature_hmac_secret_change_in_production_32_chars}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signpro-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
