<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>SignPro</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="icons/icon-32.png" alt="" width="24" height="24">
            <span>SignPro</span>
        </div>
        <div class="header-actions">
            <button id="refreshBtn" class="icon-btn" title="Refresh" aria-label="Refresh">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"/>
                    <path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
            </button>
            <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="main">
        <div id="loading" class="state-message">
            <div class="spinner"></div>
            <span>Loading...</span>
        </div>

        <div id="not-connected" class="state-message hidden">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="state-icon">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <h3>Not connected</h3>
            <p>Connect your SignPro account to receive real-time notifications about signature requests.</p>
            <button id="connectBtn" class="btn btn-primary">Connect Account</button>
        </div>

        <div id="connected" class="hidden">
            <div class="user-bar">
                <div class="user-info">
                    <span class="user-status"></span>
                    <span id="userEmail" class="user-email"></span>
                </div>
                <span id="lastPoll" class="last-poll"></span>
            </div>

            <div id="pendingList" class="pending-list">
                <h2 class="section-title">Pending Signatures <span id="pendingCount" class="badge"></span></h2>
                <div id="pendingItems"></div>
                <div id="emptyState" class="empty-state hidden">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <p>You're all caught up!</p>
                    <small>No pending signature requests.</small>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span id="connectionStatus" class="connection-status"></span>
        <a href="#" id="dashboardLink" class="footer-link">Open Dashboard →</a>
    </footer>

    <script src="popup.js"></script>
</body>
</html>
